#######################################################################
###########  enecess ecoMain example for EmonModbusTcpInterfacer  #####
#######################################################################
### Reads the ecoMain three-phase grid circuit and its 10 branch circuits
### over Modbus TCP. See readme.md in this directory for the register map,
### ecoSub branch circuits and how to invert a circuit.
###
### Copy the interfacers into the [interfacers] section of emonhub.conf
### and the nodes into the [nodes] section.

[interfacers]

[[ecoMain_grid]]
    Type = EmonModbusTcpInterfacer
    [[[init_settings]]]
        modbus_IP = 192.168.1.50   # ip address of the ecoMain
        modbus_port = 502
    [[[runtimesettings]]]
        nodeId = 30
        pubchannels = ToEmonCMS,
        interval = 10
        # ecoMain specific settings
        unit = 255                  # ecoMain Modbus unit id
        zero_based = true           # registers below are the 0-based addresses from the ecoMain manual
        word_order = little         # 32 and 64 bit values are sent low word first
        max_block_size = 125        # read consecutive registers in one request (4 requests in total)
        register = 12,28,1000,1002,1004,1006,1200,1201,1202,1203,1204,1205,1206,1207,1208

[[ecoMain_circuits]]
    Type = EmonModbusTcpInterfacer
    [[[init_settings]]]
        modbus_IP = 192.168.1.50
        modbus_port = 502
    [[[runtimesettings]]]
        nodeId = 31
        pubchannels = ToEmonCMS,
        interval = 10
        unit = 255
        zero_based = true
        word_order = little
        max_block_size = 125
        # import energy, export energy, power, then voltage/current/power factor for circuits 1..10
        register = 32,36,40,44,48,52,56,60,64,68,192,196,200,204,208,212,216,220,224,228,1008,1010,1012,1014,1016,1018,1020,1022,1024,1026,1209,1210,1211,1212,1213,1214,1215,1216,1217,1218,1219,1220,1221,1222,1223,1224,1225,1226,1227,1228,1229,1230,1231,1232,1233,1234,1235,1236,1237,1238

[nodes]

[[30]]
    nodename = ecomain_grid
    [[[rx]]]
        names = import_kwh,export_kwh,power_l1,power_l2,power_l3,power,voltage_l1,current_l1,pf_l1,voltage_l2,current_l2,pf_l2,voltage_l3,current_l3,pf_l3
        datacodes = Q,Q,i,i,i,i,H,H,h,H,H,h,H,H,h
        scales = 0.000001,0.000001,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01
        units = kWh,kWh,W,W,W,W,V,A,PF,V,A,PF,V,A,PF

[[31]]
    nodename = ecomain_circuits
    [[[rx]]]
        names = import_1,import_2,import_3,import_4,import_5,import_6,import_7,import_8,import_9,import_10,export_1,export_2,export_3,export_4,export_5,export_6,export_7,export_8,export_9,export_10,power_1,power_2,power_3,power_4,power_5,power_6,power_7,power_8,power_9,power_10,voltage_1,current_1,pf_1,voltage_2,current_2,pf_2,voltage_3,current_3,pf_3,voltage_4,current_4,pf_4,voltage_5,current_5,pf_5,voltage_6,current_6,pf_6,voltage_7,current_7,pf_7,voltage_8,current_8,pf_8,voltage_9,current_9,pf_9,voltage_10,current_10,pf_10
        datacodes = Q,Q,Q,Q,Q,Q,Q,Q,Q,Q,Q,Q,Q,Q,Q,Q,Q,Q,Q,Q,i,i,i,i,i,i,i,i,i,i,H,H,h,H,H,h,H,H,h,H,H,h,H,H,h,H,H,h,H,H,h,H,H,h,H,H,h,H,H,h
        scales = 0.000001,0.000001,0.000001,0.000001,0.000001,0.000001,0.000001,0.000001,0.000001,0.000001,0.000001,0.000001,0.000001,0.000001,0.000001,0.000001,0.000001,0.000001,0.000001,0.000001,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01
        units = kWh,kWh,kWh,kWh,kWh,kWh,kWh,kWh,kWh,kWh,kWh,kWh,kWh,kWh,kWh,kWh,kWh,kWh,kWh,kWh,W,W,W,W,W,W,W,W,W,W,V,A,PF,V,A,PF,V,A,PF,V,A,PF,V,A,PF,V,A,PF,V,A,PF,V,A,PF,V,A,PF,V,A,PF
