[[Shelly]]
    Type = EmonHubShellyInterfacer
    [[[init_settings]]]
    [[[runtimesettings]]]
        pubchannels = ToEmonCMS,
        read_interval = 10
        [[[[devices]]]]
            # Pro 3EM in triphase profile, metering a single-phase heat pump on phase A
            [[[[[heatpump]]]]]
                host = shellypro3em-aabbccddeeff.local
                fields = a_power, a_energy, a_voltage, a_current, a_pf
            # Pro 2PM: switch0_* and switch1_*
            [[[[[immersions]]]]]
                host = shellypro2pm-aabbccddeeff.local
            # Pro Dimmer 0/1-10V PM: light0_*
            [[[[[dimmer]]]]]
                host = shellypro0110pm-aabbccddeeff.local
            # A password-protected device, polled over HTTP
            [[[[[pump]]]]]
                host = 192.168.1.20
                password = secret
                transport = http
