### Reads a Fronius inverter and its smart meter over the Fronius Solar API
### See readme.md in this directory for the inputs published
[[Fronius]]
    Type = EmonHubFroniusAPIInterfacer
    [[[init_settings]]]
    [[[runtimesettings]]]
        pubchannels = ToEmonCMS,
        name = fronius           # emoncms node name
        host = 192.168.1.11      # ip address of the inverter, add :port if not 80
        readinterval = 10        # seconds between reads
        # device_id = 1          # inverter device id, if not 1
